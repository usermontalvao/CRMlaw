services:
  - type: web
    name: crm-advogado
    env: static
    buildCommand: NODE_OPTIONS=--max-old-space-size=6144 npm install && NODE_OPTIONS=--max-old-space-size=6144 npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
      # Serviço de EDIÇÃO EM CONJUNTO (repositório `collab`). Sem esta variável
      # NO MOMENTO DO BUILD, o editor abre o .docx direto do Nextcloud e cada
      # navegador fica com a sua cópia: duas pessoas no mesmo arquivo não veem o
      # que a outra digita e quem salvar por último sobrescreve a outra.
      # O Vite grava o valor dentro do bundle, então mudar isto exige NOVO BUILD.
      # É só um endereço público — não é segredo, por isso fica versionado aqui
      # (ao contrário de VITE_SUPABASE_ANON_KEY e afins, que ficam no painel).
      - key: VITE_SYNCFUSION_COLLAB_URL
        value: https://collab.jurius-api.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
