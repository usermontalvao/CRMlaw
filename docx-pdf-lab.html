<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratório — conversão DOCX → PDF</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f3; color: #18181b; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; }
      iframe { width: 100%; height: 70vh; border: 1px solid #e4e4e7; border-radius: 8px; background: #fff; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Laboratório — conversão DOCX → PDF</h1>
    <div class="row">
      <button id="gen">1. Gerar .docx de teste</button>
      <input id="file" type="file" accept=".docx" />
      <button id="conv-syncfusion" disabled>Converter (Syncfusion)</button>
      <button id="conv-preview" disabled>Converter (preview)</button>
      <button id="conv-auto" disabled>Converter (auto)</button>
      <button id="dl" disabled>Baixar PDF</button>
    </div>
    <div id="log">pronto.</div>
    <iframe id="out" title="PDF gerado"></iframe>
    <script type="module" src="/src/dev/docxPdfLab.ts"></script>
  </body>
</html>
