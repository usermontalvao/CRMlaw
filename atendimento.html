<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      PÁGINA PRÓPRIA do app "Atendimento" (módulo WhatsApp como PWA separado).

      Por que um HTML separado e não o index.html do CRM com o manifest trocado
      por JavaScript: o navegador decide QUAL app está sendo instalado a partir
      da tag rel="manifest" que ele encontra ao analisar o HTML. Trocando o
      href depois, pelo script, o Chrome já avaliou a página como o app geral —
      e "Instalar" oferecia o CRM inteiro. Com o manifest aqui, no HTML servido,
      não há dúvida: esta página é outro app, com id, escopo, nome e ícone
      próprios.

      O caminho /atendimento chega aqui por reescrita (netlify.toml em produção,
      plugin do Vite em desenvolvimento) — a URL continua limpa, sem ".html".
    -->
    <link rel="manifest" href="/atendimento.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/atendimento-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/atendimento-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atendimento" />
    <meta name="theme-color" content="#128c7e" />
    <title>Atendimento</title>
    <meta name="description" content="Atendimento via WhatsApp — conversas, fila e funil de leads." />
    <!-- Página interna: não deve ser indexada nem compartilhada. -->
    <meta name="robots" content="noindex, nofollow" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/atendimento.tsx"></script>
  </body>
</html>
