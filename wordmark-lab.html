<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Pré-render do wordmark</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
<style>
  body { font: 14px system-ui; margin: 24px; background: #fff; color: #211C18; }
  #saida { width: 100%; height: 180px; font: 11px monospace; }
  img { border: 1px solid #ddd; margin: 12px 0; display: block; }
</style>
</head>
<body>
<h1>Pré-render do wordmark "jurius.com.br"</h1>
<p>Roda EXATAMENTE o mesmo código de <code>renderWordmarkPng()</code>
(<code>pdfSignature.service.ts:558</code>), no mesmo motor (Chrome) e com a mesma
webfont Spectral. O PNG resultante vira constante — é o que torna o porte fiel
byte a byte, em vez de "parecido".</p>

<div id="status">carregando a fonte…</div>
<img id="previa" alt="prévia do wordmark" />
<div id="meta"></div>
<textarea id="saida" readonly></textarea>

<script>
// Espelho literal das constantes de src/constants/brand.ts
const BRAND_SERIF = "'Spectral', Georgia, 'Times New Roman', serif";
const BRAND_DOT = '#E45C12';
const BRAND_WORDMARK = { lead: 'jurius', dot: '.', tld: 'com.br' };

async function renderWordmarkPng() {
  const fontPx = 128;
  const family = BRAND_SERIF;
  const fonts = document.fonts;
  if (fonts && fonts.load) {
    await Promise.all([
      fonts.load(`700 ${fontPx}px 'Spectral'`),
      fonts.load(`400 ${fontPx}px 'Spectral'`),
    ]);
    await fonts.ready;
  }

  const lead = BRAND_WORDMARK.lead;
  const dot = BRAND_WORDMARK.dot;
  const tld = BRAND_WORDMARK.tld;
  const leadFont = `700 ${fontPx}px ${family}`;
  const tldFont = `400 ${fontPx}px ${family}`;

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = leadFont;
  const leadW = measure.measureText(lead).width;
  const dotW = measure.measureText(dot).width;
  measure.font = tldFont;
  const tldW = measure.measureText(tld).width;

  const padX = Math.round(fontPx * 0.06);
  const padY = Math.round(fontPx * 0.14);
  const kern = fontPx * 0.008;
  const w = Math.ceil(padX * 2 + leadW + dotW + tldW + kern * 2);
  const h = Math.ceil(fontPx * 1.02 + padY);

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.textBaseline = 'alphabetic';
  const baseY = Math.round(fontPx * 0.86 + padY / 2);
  let cx = padX;
  ctx.font = leadFont;
  ctx.fillStyle = '#211C18';
  ctx.fillText(lead, cx, baseY);
  cx += leadW + kern;
  ctx.fillStyle = BRAND_DOT;
  ctx.fillText(dot, cx, baseY);
  cx += dotW + kern;
  ctx.font = tldFont;
  ctx.fillStyle = '#A0958C';
  ctx.fillText(tld, cx, baseY);

  const dataUrl = canvas.toDataURL('image/png');
  return { dataUrl, w, h, ratio: w / h, leadW, dotW, tldW };
}

renderWordmarkPng().then((r) => {
  const b64 = r.dataUrl.split(',')[1];
  document.getElementById('previa').src = r.dataUrl;
  document.getElementById('status').textContent = 'pronto';
  document.getElementById('meta').textContent =
    `${r.w}x${r.h} px · ratio ${r.ratio.toFixed(6)} · base64 ${b64.length} chars`;
  document.getElementById('saida').value = b64;
  window.__wordmark = { base64: b64, w: r.w, h: r.h, ratio: r.ratio };
}).catch((e) => {
  document.getElementById('status').textContent = 'ERRO: ' + e.message;
});
</script>
</body>
</html>
