[build]
  command = "npm run build"
  publish = "dist"

# Serviço de EDIÇÃO EM CONJUNTO (repositório `collab`). Sem esta variável NO
# MOMENTO DO BUILD, o editor abre o .docx direto do Nextcloud e cada navegador
# fica com a sua cópia: duas pessoas no mesmo arquivo não veem o que a outra
# digita e quem salvar por último sobrescreve a outra. O Vite grava o valor
# dentro do bundle, então mudar isto exige NOVO BUILD.
[build.environment]
  VITE_SYNCFUSION_COLLAB_URL = "https://collab.jurius-api.com"

# App "Atendimento" (módulo WhatsApp como PWA separado): /atendimento é uma
# PÁGINA PRÓPRIA, com manifest próprio no HTML — é o que faz o navegador
# instalar OUTRO app em vez do CRM. Precisa vir ANTES do catch-all abaixo,
# senão a regra genérica entrega o index.html do CRM e o app some.
[[redirects]]
  from = "/atendimento"
  to = "/atendimento.html"
  status = 200

[[redirects]]
  from = "/atendimento/*"
  to = "/atendimento.html"
  status = 200

# App "Editor" (editor de petições como PWA separado). A query e o hash dos
# links existentes (/editor#editor-doc=TOKEN, /editor?initialNextcloudPath=...)
# sobrevivem à reescrita.
[[redirects]]
  from = "/editor"
  to = "/editor.html"
  status = 200

[[redirects]]
  from = "/editor/*"
  to = "/editor.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
